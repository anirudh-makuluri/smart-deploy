name: CI

on:
  pull_request:

jobs:
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation-test-only
          POSTGRES_DB: smartdeploy_foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:database
        env:
          TEST_DATABASE_URL: postgres://postgres:foundation-test-only@127.0.0.1:5432/smartdeploy_foundation_test

      - name: Install browser for database-backed client checks
        run: npx playwright install --with-deps chromium

      - name: Verify logout in the actual browser and server
        run: npm run test:e2e:database
        env:
          RUN_DATABASE_BROWSER_TESTS: '1'
          TEST_DATABASE_URL: postgres://postgres:foundation-test-only@127.0.0.1:5432/smartdeploy_foundation_test
          DATABASE_URL: postgres://postgres:foundation-test-only@127.0.0.1:5432/smartdeploy_foundation_test
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: local-browser-ci-only-secret-never-for-production
          WORKSPACE_APPS_ENABLED: 'true'
          PRIVATE_APP_GATEWAY_ENABLED: 'true'
          WAITING_LIST_ENABLED: 'false'
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          NEXT_PUBLIC_POSTHOG_KEY: ''

      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logout-browser-evidence
          path: test-results/

      - name: Verify invitee login cannot unlock platform APIs
        run: npm run test:e2e:invitee
        env:
          RUN_INVITEE_BROWSER_TESTS: '1'
          TEST_DATABASE_URL: postgres://postgres:foundation-test-only@127.0.0.1:5432/smartdeploy_foundation_test
          DATABASE_URL: postgres://postgres:foundation-test-only@127.0.0.1:5432/smartdeploy_foundation_test
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: local-browser-ci-only-secret-never-for-production
          WORKSPACE_APPS_ENABLED: 'true'
          PRIVATE_APP_GATEWAY_ENABLED: 'true'
          WAITING_LIST_ENABLED: 'true'
          SUPABASE_URL: http://127.0.0.1:45558
          SUPABASE_SERVICE_ROLE_KEY: local-approval-fixture-only
          NEXT_PUBLIC_POSTHOG_KEY: ''

      - name: Save invitee browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: invitee-browser-evidence
          path: test-results/

      - name: Verify HTTPS platform cookies against sibling injection
        run: npm run test:e2e:cookies
        env:
          RUN_COOKIE_BROWSER_TESTS: '1'
          RUN_GATEWAY_BROWSER_TESTS: '1'
          TEST_DATABASE_URL: postgres://postgres:foundation-test-only@127.0.0.1:5432/smartdeploy_foundation_test
          DATABASE_URL: postgres://postgres:foundation-test-only@127.0.0.1:5432/smartdeploy_foundation_test
          BETTER_AUTH_SECRET: local-cookie-ci-only-secret-never-for-production

      - name: Save cookie browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cookie-browser-evidence
          path: test-results/

      - name: Verify real app confirmation and gateway over HTTPS
        run: npm run test:e2e:app-login
        env:
          RUN_APP_LOGIN_BROWSER_TESTS: '1'
          TEST_DATABASE_URL: postgres://postgres:foundation-test-only@127.0.0.1:5432/smartdeploy_foundation_test
          DATABASE_URL: postgres://postgres:foundation-test-only@127.0.0.1:5432/smartdeploy_foundation_test
          BETTER_AUTH_URL: https://localhost:34433
          BETTER_AUTH_SECRET: local-confirmation-ci-only-secret-never-for-production
          WORKSPACE_APPS_ENABLED: 'true'
          PRIVATE_APP_GATEWAY_ENABLED: 'true'
          GATEWAY_CODE_TTL_SECONDS: '60'
          GATEWAY_SESSION_TTL_SECONDS: '900'
          WAITING_LIST_ENABLED: 'true'
          SUPABASE_URL: http://127.0.0.1:45559
          SUPABASE_SERVICE_ROLE_KEY: local-confirmation-approval-only
          NEXT_PUBLIC_POSTHOG_KEY: ''

      - name: Save app confirmation browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-confirmation-browser-evidence
          path: test-results/

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Typecheck application and test fixtures
        run: npm run typecheck

      - name: Build WebSocket worker
        run: npm run ws:build
